[project]
name = "who-do-i-vote-for"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "dj-database-url>=3.1.2",
    "django>=6.1.1",
    "google-adk>=1.18.0",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings>=2.12.0",
    "uvicorn>=0.38.0",
]

[dependency-groups]
dev = [
    "commitizen>=4.18.1",
    "ipykernel>=7.1.0",
    "pytest>=9.0.1",
    "pytest-django>=4.14.0",
    "ruff>=0.16.8",
    "ty>=0.0.1a26",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["backend"]
DJANGO_SETTINGS_MODULE = "config.settings.local"

[tool.commitizen]
name = "cz_conventional_commits"
tag_format = "v$version"
version_scheme = "pep440"
version_provider = "pep621"

[tool.ruff.lint.isort]
known-first-party = ["apps", "config"]

[tool.ruff.lint.per-file-ignores]
# Django views: `request` is part of the view signature even when unused
"backend/**/views.py" = ["ARG001"]
# Django settings modules: star-imports are the convention (base + env overrides)
"backend/config/settings/*" = ["F401", "F403", "F405"]
# Legacy ADK agent configs (deleted at Phase 3 cutover)
"my_politician/**" = ["INP001"]
"political_profiler/**" = ["INP001"]
# Tests: no package marker needed; asserts are the point
"tests/**" = ["INP001", "S101"]

[tool.ruff.lint]
select = [
    "E",
	"I",
    "ANN",
    "FBT",
    "DTZ",
    "RET",
    "SIM",
    "W",
    "F",
    "C90",
    "ERA",
    "BLE",
    "S",
    "B",
    "T20",
    "INP",
    "PIE",
    "PYI",
    "ARG",
    "PTH",
    "N",
    "PD",
    "RUF",
    "UP",
    "PLR2004",
    "PLR5501",
    "FAST"
    ]
ignore = [
    "E501",
    "W291",
    "C901",
    "E203",
    "E231",
    "S608",
    "S311",
    "BLE001",
    "RUF012",
    "N805",
    "DTZ005",
]

[tool.ty.environment]
extra-paths = ["backend"]
