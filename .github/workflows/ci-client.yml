name: CI Client

# Temporary: verifies the legacy React client still builds.
# Removed at the Phase 3 cutover when client/ is deleted.

on:
  push:
    branches: [main]
    paths:
      - "client/**"
      - ".github/workflows/ci-client.yml"
  pull_request:
    paths:
      - "client/**"
      - ".github/workflows/ci-client.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  client:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: client

      - name: Build
        run: npm run build
        working-directory: client
